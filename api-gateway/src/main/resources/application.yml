server:
  port: ${PORT:8080}

spring:
  application:
    name: api-gateway

  cloud:
    discovery:
      enabled: true
    gateway:
      routes:
        - id: auth-service
          uri: lb://AUTH-SERVICE
          predicates:
            - Path=/api/v1/auth/**,/auth/**,/oauth2/**,/login/oauth2/**

        - id: product-service
          uri: lb://PRODUCT-SERVICE
          predicates:
            - Path=/products/**
          filters:
            - AuthenticationFilter

        - id: product-service-legacy
          uri: lb://PRODUCT-SERVICE
          predicates:
            - Path=/api/v1/products/**
          filters:
            - AuthenticationFilter

        - id: warehouse-service
          uri: lb://WAREHOUSE-SERVICE
          predicates:
            - Path=/api/v1/warehouses/**,/api/v1/stock/**
          filters:
            - AuthenticationFilter

        - id: purchase-service
          uri: lb://PURCHASE-SERVICE
          predicates:
            - Path=/api/v1/purchase-orders/**
          filters:
            - AuthenticationFilter

        - id: supplier-service
          uri: lb://SUPPLIER-SERVICE
          predicates:
            - Path=/api/v1/suppliers/**
          filters:
            - AuthenticationFilter

        - id: movement-service
          uri: lb://MOVEMENT-SERVICE
          predicates:
            - Path=/api/v1/movements/**
          filters:
            - AuthenticationFilter

        - id: alert-service
          uri: lb://ALERT-SERVICE
          predicates:
            - Path=/api/v1/alerts/**
          filters:
            - AuthenticationFilter

        - id: report-service
          uri: lb://REPORT-SERVICE
          predicates:
            - Path=/api/v1/reports/**
          filters:
            - AuthenticationFilter

  boot:
    admin:
      client:
        url: http://localhost:9090

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka

management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    health:
      show-details: always

app:
  jwt:
    secret: ${JWT_SECRET:ThisIsASecretKeyForJwtTokenGenerationThatMustBeAtLeast32BytesLong12345}
    expiration-ms: 3600000
